openapi: 3.1.0
info:
  title: Pennylane Company API v2 — mock
  description: Read-only mock of the Pennylane v2 API on the « Boréal Conseil » world.
    Cursor envelope `{items, has_more, next_cursor}`, amounts as STRINGS, granular
    scopes, changelogs for incremental extraction.
  version: 0.2.0
servers:
- url: https://app.pennylane.com
paths:
  /api/external/v2/me:
    get:
      tags:
      - Users
      summary: User and company profile
      description: 'A connector''s smoke test: who am I, and what can I read?


        No scope required — this is precisely the endpoint used to discover

        which scopes are available. A connector must call it BEFORE opening its

        pipeline: failing on authentication beats a half-done run.'
      operationId: me_api_external_v2_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: 'Invalid parameter: `limit` out of bounds (it is NOT clamped),
            unreadable `cursor`, malformed `filter`, or `start_date` and `cursor`
            sent together on a changelog.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '401':
          description: Token missing, invalid or expired — the three cases are indistinguishable.
            NOT retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '403':
          description: The token does not carry the required scope. The message NAMES
            the missing scope. NOT retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '404':
          description: Unknown resource, or belonging to another company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '422':
          description: 'Business rule violated. On a changelog: `start_date` beyond
            the four-week retention window.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '429':
          description: Rate limit reached — 25 requests / 5 s per token. **The body
            is PLAIN TEXT, not JSON**; `retry-after` header. The `ratelimit-*` headers
            are present on ALL responses.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Injected failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '503':
          description: Injected transient failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
  /api/external/v2/trial_balance:
    get:
      tags:
      - Accounting
      summary: General trial balance over a period
      description: '`period_start` and `period_end` are REQUIRED.


        This is the mock''s only resource that requires parameters — and it''s

        deliberate at the provider: a trial balance without a period makes no

        sense. A consumer that omits them must get 400, not a balance for the

        current fiscal year chosen on its behalf.'
      operationId: trial_balance_api_external_v2_trial_balance_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_TrialBalanceLine_'
        '400':
          description: 'Invalid parameter: `limit` out of bounds (it is NOT clamped),
            unreadable `cursor`, malformed `filter`, or `start_date` and `cursor`
            sent together on a changelog.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '401':
          description: Token missing, invalid or expired — the three cases are indistinguishable.
            NOT retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '403':
          description: The token does not carry the required scope. The message NAMES
            the missing scope. NOT retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '404':
          description: Unknown resource, or belonging to another company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '422':
          description: 'Business rule violated. On a changelog: `start_date` beyond
            the four-week retention window.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '429':
          description: Rate limit reached — 25 requests / 5 s per token. **The body
            is PLAIN TEXT, not JSON**; `retry-after` header. The `ratelimit-*` headers
            are present on ALL responses.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Injected failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
        '503':
          description: Injected transient failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PennylaneError'
      parameters:
      - name: period_start
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Start of the period. REQUIRED.
      - name: period_end
        in: query
        required: true
        schema:
          type: string
          format: date
        description: End of the period. REQUIRED.
      - name: is_auxiliary
        in: query
        required: false
        schema:
          type: boolean
        description: 'Detail auxiliary accounts. When false, they are AGGREGATED into
          their root: summing both views doubles the assets.'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Pagination cursor, OPAQUE. Reuse the previous response's `next_cursor`
          as-is; decoding it means leaning on an implementation detail the provider's
          documentation shows under three incompatible forms. An unreadable cursor
          renders 400.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        description: Page size. Default 20, between 1 and 1000. An out-of-bounds value
          renders 400 — it is NOT silently clamped.
