            de la rétention de quatre semaines.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '429':
          description: Limite de débit atteinte — 25 requêtes / 5 s au jeton. **Le
            corps est du TEXTE BRUT, pas du JSON** ; en-tête `retry-after`. Les en-têtes
            `ratelimit-*` sont présents sur TOUTES les réponses.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Panne injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '503':
          description: Panne transitoire injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
