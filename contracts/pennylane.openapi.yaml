openapi: 3.1.0
info:
  title: Pennylane Company API v2 — mock
  description: Mock de l'API Pennylane v2 (lecture seule) sur le monde « Boréal Conseil
    ». Enveloppe à curseur `{items, has_more, next_cursor}`, montants en CHAÎNES,
    scopes granulaires, changelogs pour l'extraction incrémentale.
  version: 0.1.1
servers:
- url: https://app.pennylane.com
paths:
  /api/external/v2/me:
    get:
      tags:
      - Users
      summary: Profil de l'utilisateur et de la société
      description: 'Le test de fumée d''un connecteur : qui suis-je, et que puis-je
        lire ?


        Aucun scope requis — c''est justement lui qui sert à découvrir les scopes

        dont on dispose. Un connecteur doit l''appeler AVANT d''ouvrir son pipeline
        :

        échouer sur une authentification vaut mieux qu''un run à moitié fait.'
      operationId: profil_api_external_v2_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilUtilisateur'
        '400':
          description: 'Paramètre invalide : `limit` hors bornes (elle n''est PAS
            rabotée), `cursor` illisible, `filter` mal formé, ou `start_date` et `cursor`
            envoyés ensemble sur un changelog.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '401':
          description: Jeton absent, invalide ou expiré — les trois cas sont indistincts.
            N'est PAS retentable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '403':
          description: Le jeton ne porte pas le scope requis. Le message NOMME le
            scope manquant. N'est PAS retentable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '404':
          description: Ressource inconnue, ou appartenant à une autre société.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '422':
          description: 'Règle métier violée. Sur un changelog : `start_date` au-delà
            de la rétention de quatre semaines.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '429':
          description: Limite de débit atteinte — 25 requêtes / 5 s au jeton. **Le
            corps est du TEXTE BRUT, pas du JSON** ; en-tête `retry-after`. Les en-têtes
            `ratelimit-*` sont présents sur TOUTES les réponses.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Panne injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '503':
          description: Panne transitoire injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
  /api/external/v2/trial_balance:
    get:
      tags:
      - Accounting
      summary: Balance générale sur une période
      description: '`period_start` et `period_end` sont OBLIGATOIRES.


        C''est la seule ressource du mock qui exige des paramètres — et c''est

        délibéré chez le fournisseur : une balance sans période n''a pas de sens.

        Un consommateur qui les oublie doit recevoir 400, pas une balance de

        l''exercice courant choisie à sa place.'
      operationId: trial_balance_api_external_v2_trial_balance_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_LigneBalance_'
        '400':
          description: 'Paramètre invalide : `limit` hors bornes (elle n''est PAS
            rabotée), `cursor` illisible, `filter` mal formé, ou `start_date` et `cursor`
            envoyés ensemble sur un changelog.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '401':
          description: Jeton absent, invalide ou expiré — les trois cas sont indistincts.
            N'est PAS retentable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '403':
          description: Le jeton ne porte pas le scope requis. Le message NOMME le
            scope manquant. N'est PAS retentable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '404':
          description: Ressource inconnue, ou appartenant à une autre société.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '422':
          description: 'Règle métier violée. Sur un changelog : `start_date` au-delà
            de la rétention de quatre semaines.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '429':
          description: Limite de débit atteinte — 25 requêtes / 5 s au jeton. **Le
            corps est du TEXTE BRUT, pas du JSON** ; en-tête `retry-after`. Les en-têtes
            `ratelimit-*` sont présents sur TOUTES les réponses.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Panne injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
        '503':
          description: Panne transitoire injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurPennylane'
      parameters:
      - name: period_start
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Début de la période. OBLIGATOIRE.
      - name: period_end
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fin de la période. OBLIGATOIRE.
      - name: is_auxiliary
        in: query
        required: false
        schema:
          type: boolean
        description: 'Détailler les comptes auxiliaires. À faux, ils sont AGRÉGÉS
          dans leur racine : sommer les deux vues double l''actif.'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Curseur de pagination, OPAQUE. Reprendre tel quel le `next_cursor`
          de la réponse précédente ; le décoder, c'est s'adosser à un détail d'implémentation
          que la documentation du fournisseur montre sous trois formes incompatibles.
          Un curseur illisible rend 400.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        description: Taille de page. Défaut 20, entre 1 et 1000. Une valeur hors bornes
          rend 400 — elle n'est PAS rabotée en silence.
  /api/external/v2/pa_registrations:
    get:
      tags:
