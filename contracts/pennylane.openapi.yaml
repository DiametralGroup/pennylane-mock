        fumée

        naturel d''un connecteur : il dit qui on est et ce qu''on a le droit de lire.'
    Reference:
      properties:
        id:
          type: integer
          title: Id
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      additionalProperties: true
      type: object
      required:
      - id
      title: Reference
      description: 'Un pointeur vers une autre ressource — `{"id": 42, "url": "…"}`.


        Certaines références ne portent QUE `id` (`ledger_entry`,

        `billing_subscription`, `category_group`) ; d''autres portent aussi `url`.

        Le fournisseur n''est pas uniforme là-dessus, et `url` est donc optionnel.'
    Reglement:
      properties:
        id:
          type: integer
          title: Id
        label:
          type: string
          title: Label
        currency:
          type: string
          title: Currency
        currency_amount:
          type: string
          title: Currency Amount
        status:
          type: string
          title: Status
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: true
      type: object
      required:
      - id
      - label
      - currency
      - currency_amount
      - status
      - created_at
      - updated_at
      title: Reglement
      description: 'Un règlement rattaché à une facture.


        ⚠️ Un `payment` n''est PAS une `matched_transaction` : le premier est le

        règlement enregistré sur la facture, la seconde le mouvement bancaire

        apparié. Le fournisseur consacre une page entière à la distinction, et un

        consommateur qui les additionne compte deux fois l''encaissement.'
    Remise:
      properties:
        type:
          type: string
          title: Type
          description: absolute | relative
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
      additionalProperties: true
      type: object
      required:
      - type
      title: Remise
