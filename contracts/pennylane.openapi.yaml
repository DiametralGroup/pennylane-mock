          rend 400 — elle n'est PAS rabotée en silence.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: -id
        description: Champ de tri, préfixé de `-` pour l'ordre décroissant. Défaut
          `-id` — donc DÉCROISSANT si rien n'est précisé, ce qui est l'inverse de
          l'intuition.
      - name: filter
        in: query
        required: false
        schema:
          type: string
        example: '[{"field": "date", "operator": "gteq", "value": "2026-01-01"}]'
        description: 'Tableau JSON d''objets `{field, operator, value}`, cumulés en
          ET. Opérateurs : eq, not_eq, lt, lteq, gt, gteq, in, not_in, start_with.
          ⚠️ Le curseur N''ENCODE PAS les filtres : il faut les REJOUER sur chaque
          page, sinon les pages 2+ rendent des résultats non filtrés.'
