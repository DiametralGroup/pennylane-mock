components:
  schemas:
    Address:
      properties:
        address:
          type: string
          title: Address
        postal_code:
          type: string
          title: Postal Code
        city:
          type: string
          title: City
        country_alpha2:
          type: string
          title: Country Alpha2
      additionalProperties: true
      type: object
      required:
      - address
      - postal_code
      - city
      - country_alpha2
      title: Address
    AllocatedCategory:
      properties:
        id:
          type: integer
          title: Id
        label:
          type: string
          title: Label
        weight:
          type: string
          title: Weight
        category_group:
          $ref: '#/components/schemas/Reference'
        analytical_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Analytical Code
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: true
      type: object
      required:
      - id
      - label
      - weight
      - category_group
      - created_at
      - updated_at
      title: AllocatedCategory
      description: 'A category as it appears ON an entry or a transaction: the category,

        plus the allocation''s `weight` — also a string.'
    BankAccount:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        currency:
          type: string
          title: Currency
        balance:
          type: string
          title: Balance
        bank_establishment:
          $ref: '#/components/schemas/Reference'
        journal:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        ledger_account:
          $ref: '#/components/schemas/Reference'
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: true
      type: object
      required:
      - id
      - name
      - currency
      - balance
      - bank_establishment
      - ledger_account
      - created_at
      - updated_at
      title: BankAccount
    BankEstablishment:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: true
      type: object
      required:
      - id
      - name
      - created_at
      - updated_at
      title: BankEstablishment
    Category:
      properties:
        id:
          type: integer
          title: Id
        label:
          type: string
          title: Label
        direction:
          anyOf:
          - type: string
          - type: 'null'
          title: Direction
        category_group:
          $ref: '#/components/schemas/Reference'
        analytical_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Analytical Code
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: true
      type: object
      required:
      - id
      - label
      - category_group
      - created_at
      - updated_at
      title: Category
    CategoryGroup:
      properties:
        id:
          type: integer
          title: Id
        label:
          type: string
          title: Label
        categories:
          $ref: '#/components/schemas/Link'
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: true
      type: object
      required:
      - id
      - label
      - categories
      - created_at
      - updated_at
      title: CategoryGroup
      description: An analytical axis. `categories` is a LINK, not an array.
    ChangelogEvent:
      properties:
        id:
          type: integer
          title: Id
        operation:
          type: string
          title: Operation
          description: insert | update | delete
        processed_at:
          type: string
          title: Processed At
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: true
      type: object
      required:
      - id
      - operation
      - processed_at
      - created_at
      - updated_at
      title: ChangelogEvent
      description: 'A change. It carries the ID and the operation, **never the state**:
        a

        second, batched call is needed to get the resource.'
    Contact:
      properties:
        id:
          type: integer
          title: Id
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        email:
          type: string
          title: Email
        phone:
          type: string
          title: Phone
        job_title:
          type: string
          title: Job Title
          x-pennylane-confidence: unverified
          x-pennylane-note: the `getcustomercontacts` reference doesn't detail the
            element's schema; the served fields are plausible
        customer:
          $ref: '#/components/schemas/Reference'
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: true
      type: object
      required:
      - id
      - first_name
      - last_name
      - email
      - phone
      - job_title
      - customer
      - created_at
      - updated_at
      title: Contact
      description: 'A customer''s contact.


        WARNING: PERSONAL DATA. The mock serves it because the provider serves

        it; a connector should only extract an allow-listed subset.'
    Customer:
      properties:
        id:
          type: integer
          title: Id
        customer_type:
          type: string
          title: Customer Type
          description: company | individual — THE discriminant.
        name:
          type: string
          title: Name
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: Individuals only.
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: Individuals only.
        reg_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Reg No
          description: Companies only (SIREN).
        vat_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Vat Number
          description: Companies only.
        billing_iban:
          anyOf:
          - type: string
          - type: 'null'
          title: Billing Iban
        payment_conditions:
          type: string
          title: Payment Conditions
        recipient:
          type: string
          title: Recipient
        phone:
          type: string
          title: Phone
        reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        ledger_account:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        emails:
          items:
            type: string
          type: array
          title: Emails
        billing_address:
          $ref: '#/components/schemas/Address'
        delivery_address:
          $ref: '#/components/schemas/Address'
        external_reference:
          type: string
          title: External Reference
        billing_language:
          type: string
          title: Billing Language
        mandates:
          $ref: '#/components/schemas/Link'
        pro_account_mandates:
          $ref: '#/components/schemas/Link'
        contacts:
          $ref: '#/components/schemas/Link'
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: true
      type: object
      required:
      - id
      - customer_type
      - name
      - payment_conditions
      - recipient
      - phone
      - emails
      - billing_address
      - delivery_address
      - external_reference
      - billing_language
      - mandates
      - pro_account_mandates
      - contacts
      - created_at
      - updated_at
      title: Customer
      description: 'Customer — a company OR an individual.


        The provider makes this a two-variant `oneOf` discriminated by

        `customer_type`, and the two don''t share the same fields: `name`/

        `reg_no`/`vat_number` on one side, `first_name`/`last_name` on the

        other. The model merges them, with the per-variant fields made

        optional — a pydantic `oneOf` would produce a more accurate contract but

        would make the route factory unreadable; the nuance is carried by the

        description and by the discriminant field, which itself is required.'
    CustomerInvoice:
      properties:
        id:
          type: integer
          title: Id
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        invoice_number:
          type: string
          title: Invoice Number
          description: Empty while the invoice is a draft.
        currency:
          type: string
          title: Currency
        amount:
          type: string
          title: Amount
        currency_amount:
          type: string
          title: Currency Amount
        currency_amount_before_tax:
          type: string
          title: Currency Amount Before Tax
        exchange_rate:
          type: string
          title: Exchange Rate
        date:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
        deadline:
          anyOf:
          - type: string
          - type: 'null'
          title: Deadline
          description: 'Due date as SERVED: it depends on the customer''s payment
            terms, it isn''t derived from `date`.'
        currency_tax:
          type: string
          title: Currency Tax
        tax:
          type: string
          title: Tax
        language:
          type: string
          title: Language
        paid:
          type: boolean
          title: Paid
        status:
          type: string
          title: Status
        discount:
          $ref: '#/components/schemas/Discount'
        ledger_entry:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: '`null` on a draft: a draft has no ledger entry.'
        public_file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Public File Url
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
        remaining_amount_with_tax:
          anyOf:
          - type: string
          - type: 'null'
          title: Remaining Amount With Tax
        remaining_amount_without_tax:
          anyOf:
          - type: string
          - type: 'null'
          title: Remaining Amount Without Tax
        draft:
          type: boolean
          title: Draft
        special_mention:
          anyOf:
          - type: string
          - type: 'null'
          title: Special Mention
        customer:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        invoice_line_sections:
          $ref: '#/components/schemas/Link'
        invoice_lines:
          $ref: '#/components/schemas/Link'
        custom_header_fields:
          $ref: '#/components/schemas/Link'
        categories:
          $ref: '#/components/schemas/Link'
        pdf_invoice_free_text:
          type: string
          title: Pdf Invoice Free Text
        pdf_invoice_subject:
          type: string
          title: Pdf Invoice Subject
        pdf_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Pdf Description
        billing_subscription:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        credited_invoice:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        customer_invoice_template:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        transaction_reference:
          anyOf:
          - additionalProperties: true
