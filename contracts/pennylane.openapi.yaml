      - name: filter
        in: query
        required: false
        schema:
          type: string
        example: '[{"field": "date", "operator": "gteq", "value": "2026-01-01"}]'
        description: 'JSON array of `{field, operator, value}` objects, combined with
          AND. Operators: eq, not_eq, lt, lteq, gt, gteq, in, not_in, start_with.
          WARNING: the cursor does NOT ENCODE filters: they must be REPLAYED on every
          page, otherwise pages 2+ return unfiltered results.'
