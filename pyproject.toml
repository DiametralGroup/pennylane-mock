[project]
name = "pennylane-mock"
version = "0.2.0"
description = "Pennylane Company API v2 mock — the accounting view of the Boréal Conseil world"
readme = "README.md"
requires-python = ">=3.12"
# Le périmètre des dépendances est une décision, pas un accident : FastAPI et
# uvicorn, rien d'autre. Le curseur de pagination est du base64 de JSON — de la
# stdlib — et l'authentification est un Bearer statique : aucune crypto tierce
# n'est nécessaire.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
pennylane-mock = "pennylane_mock.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pennylane_mock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ARG"]
# PLR0913/PLR2004 : un mock manipule des seuils et des formes verbeuses par
# nature ; PLC0415 : les imports différés sont délibérés (montage conditionnel
# de /__admin, cycle state ↔ dataset ↔ settings).
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pennylane_mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
pythonpath = ["."]
